name: Career AI Lab Tests
on:
  push:
    paths:
      - 'career-ai-lab/**'
      - '.github/workflows/career-ai-lab-tests.yml'
  pull_request:
    paths:
      - 'career-ai-lab/**'
      - '.github/workflows/career-ai-lab-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'career-ai-lab/requirements.txt'
      - name: Install dependencies
        run: python -m pip install -r career-ai-lab/requirements.txt
      - name: Run contract and smoke tests
        run: python -m unittest discover -s career-ai-lab/tests -v
